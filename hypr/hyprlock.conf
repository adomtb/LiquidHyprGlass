# Verrou de session (hyprlock)
# Couleurs générées par matugen -> hyprlock-colors.conf
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# --- Fond : capture de l'écran, floutée -----------------------------------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# --- Heure -------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 120
    font_family = $font
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# --- Date ------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $on_surface_variant
    font_size = 22
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

# --- Champ mot de passe -------------------------------------------------
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    rounding = 14
    outer_color = $outline
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = Mot de passe
    check_color = $primary
    fail_color = $error
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -40
    halign = center
    valign = center
}

# --- Utilisateur --------------------------------------------------------
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 16
    font_family = $font
    position = 0, -125
    halign = center
    valign = center
}
