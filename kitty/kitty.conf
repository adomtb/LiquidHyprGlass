# Remote control (needed so theme reloads can push to already-open
# windows via IPC instead of relying only on kitty's config file watcher,
# which can miss atomic rewrites of included files like current-theme.conf)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
# background_opacity 0.70
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_windowmap ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled




include matugen-colors.conf


# BEGIN_KITTY_THEME
# Matugen
# Désactivé : ce fichier est un instantané statique pris par le sélecteur de
# thèmes kitty (kitten themes) et écrase les couleurs matugen-colors.conf
# ci-dessus avec d'anciennes couleurs à chaque démarrage, au lieu de suivre
# le fond d'écran actuel.
# include current-theme.conf
# END_KITTY_THEME