[config]
reload_apps = true
prefer = "saturation"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = "hyprctl reload"

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen-colors.conf'
post_hook = 'killall -USR1 kitty || :'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.wayle]
input_path = '~/.config/matugen/templates/wayle.toml'
output_path = '~/.config/wayle/matugen/colors.toml'
post_hook = "wayle panel restart"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-colors.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

# --- VS Code : extension "Matugen Theme" (haikalllp.matugen-theme) ---------
# L'extension surveille ces 2 fichiers et régénère le thème toute seule.
[templates.vscode-raw]
input_path = '~/.config/matugen/templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

